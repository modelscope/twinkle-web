name: Build

on:
  pull_request:
    branches: ['main']
  workflow_call:
    outputs:
      artifact-id:
        description: 'The ID of the uploaded Pages artifact'
        value: ${{ jobs.build.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Content sources are locked in content-sources.json; CI checks out the
      # exact commits (never a moving branch) into .sources/.
      - name: Read locked sources
        id: sources
        run: |
          python3 - <<'EOF'
          import json, os
          m = json.load(open('content-sources.json'))['sources']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for name, spec in m.items():
                  f.write(f'{name}_repo={spec["repo"]}\n')
                  f.write(f'{name}_commit={spec["commit"]}\n')
          EOF

      - name: Checkout ms-swift (docs v5 + assets)
        uses: actions/checkout@v4
        with:
          repository: modelscope/ms-swift
          ref: ${{ steps.sources.outputs.swift_commit }}
          path: .sources/swift
          fetch-depth: 1

      - name: Checkout twinkle (component reference docs)
        uses: actions/checkout@v4
        with:
          repository: modelscope/twinkle
          ref: ${{ steps.sources.outputs.twinkle_commit }}
          path: .sources/twinkle
          fetch-depth: 1

      - name: Checkout regression results (perf data)
        uses: actions/checkout@v4
        with:
          repository: tastelikefeet/swift5-regression-exps
          ref: ${{ steps.sources.outputs.regression_commit }}
          path: .sources/regression
          fetch-depth: 1
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare content
        run: python3 scripts/prepare-content.py

      - name: Build static site
        env:
          SITE_BASE_PATH: /twinkle-web
        run: npx next build

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
